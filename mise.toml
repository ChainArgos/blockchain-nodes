[tools]
rust = { version = "1.98.0", profile = "minimal", components = ["rustfmt", "clippy"] }
"cargo:rust-script" = "0.36.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"

[settings]
lockfile = true

[tasks.build]
description = "Build a Docker image"
usage = 'arg "<package>" help="Package name to build"'
run = "./docker-build.rs ${usage_package:?}"

[tasks."build-dry"]
description = "Build a Docker image (dry run)"
usage = 'arg "<package>" help="Package name to build"'
run = "./docker-build.rs ${usage_package:?} --dry-run"

[tasks.exists]
description = "Check if Docker image exists on Docker Hub"
usage = 'arg "<package>" help="Package name"'
run = 'rust-script --pkg-path "${RUST_SCRIPT_DOCKER_EXISTS_PKG_PATH:-$HOME/.cache/rust-script/docker-exists}" ./docker-exists.rs ${usage_package:?}'

[tasks."exists-verbose"]
description = "Check if Docker image exists (verbose)"
usage = 'arg "<package>" help="Package name"'
run = 'rust-script --pkg-path "${RUST_SCRIPT_DOCKER_EXISTS_PKG_PATH:-$HOME/.cache/rust-script/docker-exists}" ./docker-exists.rs ${usage_package:?} --verbose'

[tasks."exists-platform"]
description = "Check if platform-specific Docker image exists"
usage = '''
arg "<package>" help="Package name"
arg "<platform>" help="Platform (e.g. amd64, arm64)"
'''
run = 'rust-script --pkg-path "${RUST_SCRIPT_DOCKER_EXISTS_PKG_PATH:-$HOME/.cache/rust-script/docker-exists}" ./docker-exists.rs ${usage_package:?} --platform ${usage_platform:?}'

[tasks.restart]
description = "Restart a container with log following"
usage = 'arg "<container>" help="Container name"'
run = "./containerctl.rs restart ${usage_container:?} -f"

[tasks.stop]
description = "Stop a container"
usage = 'arg "<container>" help="Container name"'
run = "./containerctl.rs stop ${usage_container:?}"

[tasks.ci]
description = "Check the Rust automation workspace"
run = "cargo check --workspace --all-targets --locked"

[tasks.test]
description = "Test the Rust automation workspace"
run = "cargo nextest run --workspace --all-targets --locked"

[tasks.lint]
description = "Lint the Rust automation workspace"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."build-all"]
description = "Build all Docker images in sequence"
run = """
./docker-build.rs debian-blockchain-base
./docker-build.rs debian-blockchain-build
./docker-build.rs arbitrum
./docker-build.rs avalanchego
./docker-build.rs bnb-beacon-chain
./docker-build.rs bitcoin-core
./docker-build.rs bor
./docker-build.rs bsc-geth
./docker-build.rs cardano-node
./docker-build.rs celo-geth
./docker-build.rs dogecoin-core
./docker-build.rs geth
./docker-build.rs gnosis-geth
./docker-build.rs heco-geth
./docker-build.rs heimdall
./docker-build.rs kcc-geth
./docker-build.rs lighthouse
./docker-build.rs litecoin-core
./docker-build.rs octez
./docker-build.rs omnicore
./docker-build.rs op-geth
./docker-build.rs op-node
./docker-build.rs ronin-geth
./docker-build.rs scroll-geth
./docker-build.rs tron-java
./docker-build.rs wbt-geth
"""
