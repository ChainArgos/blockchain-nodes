name: Docker Build and Publish

# Builds each affected docker-* package in its own matrix job. Docker Hub
# publication happens from the writer lane; the read-only lane in a `both`
# run validates the same build plan without pushing.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lanes:
        description: Which runner lane(s) should execute the build
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDX_CACHE: registry

jobs:
  select:
    name: Select affected Docker packages
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      work_required: ${{ steps.select.outputs.work_required }}
      force_base: ${{ steps.select.outputs.force_base }}
      force_build: ${{ steps.select.outputs.force_build }}
      manual_dispatch: ${{ steps.select.outputs.manual_dispatch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          manual_dispatch=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            manual_dispatch=true
            changed=$(git ls-files)
          elif [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}")
          fi

          declare -A affected=()
          all=false
          force_base=false
          force_build=false

          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            case "${path}" in
              docker-build.rs|docker-exists.rs|mise.toml|Cargo.toml|Cargo.lock)
                all=true
                ;;
              README.md|README.*|**/*.md|RULES.md|BRANCHING.md|COMMITS.md|BUILD_SYSTEM.md|NODE_UPDATES.md|SKILLS.md|docker-compose.yml|.node-updates/*|.node-updates/**|.github/AGENTS.md|.github/workflows/ci.yml|.github/workflows/dco.yml|.github/workflows/renovate.yml|.github/workflows/build-publish.yml|.github/renovate-config.js|containerctl.rs|LICENSE|renovate.json)
                ;;
              docker-debian-blockchain-base/*)
                affected[debian-blockchain-base]=1
                force_base=true
                force_build=true
                for build_toml in docker-*/build.toml; do
                  package="${build_toml#docker-}"
                  package="${package%/build.toml}"
                  affected["${package}"]=1
                done
                ;;
              docker-debian-blockchain-build/*)
                affected[debian-blockchain-build]=1
                force_build=true
                for dockerfile in docker-*/Dockerfile; do
                  package="${dockerfile#docker-}"
                  package="${package%/Dockerfile}"
                  if rg -q '^FROM chainargos/debian-blockchain-build:' "${dockerfile}"; then
                    affected["${package}"]=1
                  fi
                done
                ;;
              docker-*)
                package="${path#docker-}"
                package="${package%%/*}"
                if [ -f "docker-${package}/build.toml" ]; then
                  affected["${package}"]=1
                  case "${package}" in
                    debian-blockchain-base)
                      force_base=true
                      force_build=true
                      ;;
                    debian-blockchain-build)
                      force_build=true
                      ;;
                  esac
                else
                  all=true
                fi
                ;;
              *)
                all=true
                ;;
            esac
          done <<< "${changed}"

          if [ "${all}" = true ]; then
            for build_toml in docker-*/build.toml; do
              package="${build_toml#docker-}"
              package="${package%/build.toml}"
              affected["${package}"]=1
            done
            force_base=true
            force_build=true
          fi

          leaf_packages=()
          for package in "${!affected[@]}"; do
            case "${package}" in
              debian-blockchain-base|debian-blockchain-build) ;;
              *) leaf_packages+=("${package}") ;;
            esac
          done

          if [ "${#leaf_packages[@]}" -eq 0 ] && [ "${force_base}" = false ] && [ "${force_build}" = false ]; then
            work_required=false
            packages='[]'
          else
            work_required=true
            packages=$(printf '%s\n' "${leaf_packages[@]}" | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          fi

          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"
          echo "work_required=${work_required}" >> "${GITHUB_OUTPUT}"
          echo "force_base=${force_base}" >> "${GITHUB_OUTPUT}"
          echo "force_build=${force_build}" >> "${GITHUB_OUTPUT}"
          echo "manual_dispatch=${manual_dispatch}" >> "${GITHUB_OUTPUT}"
          echo "packages=${packages}"
          echo "work_required=${work_required}"
          echo "force_base=${force_base}"
          echo "force_build=${force_build}"

  # Single Docker Hub existence probe for every package this run may build.
  # The base, build, and packages jobs previously each ran their own copy of
  # the probe script against the same registry state; the results are lane
  # independent, so they are probed once here and consumed via `results`.
  # Per-package probe failures are recorded, not raised, so sibling package
  # jobs keep their current fail isolation: a package whose probe failed still
  # fails its own job ("refusing to guess") without blocking the others.
  probe:
    name: Probe Docker Hub image state
    needs: select
    if: needs.select.outputs.work_required == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      results: ${{ steps.probe.outputs.results }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust cargo:rust-script"

      # Same key lineage as the GitHub-lane jobs (this job also runs on
      # ubuntu-26.04), so the compiled docker-exists helper is shared instead
      # of maintaining a second cache entry.
      - name: Cache rust-script
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rust-script
          key: rust-script-GitHub-${{ runner.os }}-v1-${{ hashFiles('docker-*.rs', 'containerctl.rs', 'docker-*/**/*.rs', 'mise.toml') }}
          restore-keys: |
            rust-script-GitHub-${{ runner.os }}-

      - name: Probe image existence on Docker Hub
        id: probe
        env:
          PACKAGES: ${{ needs.select.outputs.packages }}
        run: |
          set -euo pipefail
          exists_cmd=(rust-script --pkg-path "${RUST_SCRIPT_DOCKER_EXISTS_PKG_PATH:-$HOME/.cache/rust-script/docker-exists}" ./docker-exists.rs)

          probe_package() {
            local package="$1" platforms manifest manifest_result platform
            local platform_count platforms_json platform_status platform_result entry
            platforms=$(sed -n 's/^platforms = \[\(.*\)\]/\1/p' "docker-${package}/build.toml" | tr -d '"' | tr ',' ' ')

            manifest_status=fail
            manifest=""
            if manifest_result="$("${exists_cmd[@]}" "${package}")"; then
              manifest="${manifest_result}"
              manifest_status=ok
            fi

            platform_count=0
            platforms_json='[]'
            if [ "${manifest_status}" = "ok" ]; then
              for platform in ${platforms}; do
                platform_count=$((platform_count + 1))
                platform_status=fail
                if platform_result="$("${exists_cmd[@]}" --platform "${platform}" "${package}")"; then
                  case "${platform_result}" in
                    true|false) platform_status="${platform_result}" ;;
                    *) platform_status=invalid ;;
                  esac
                fi
                platforms_json=$(jq -c --arg name "${platform}" --arg status "${platform_status}" \
                  '. + [{name: $name, status: $status}]' <<<"${platforms_json}")
              done
            fi

            entry="$(jq -cn \
              --arg manifest "${manifest}" \
              --arg manifest_status "${manifest_status}" \
              --argjson platform_count "${platform_count}" \
              --argjson platforms "${platforms_json}" \
              '{manifest: $manifest, manifest_status: $manifest_status, platform_count: $platform_count, platforms: $platforms}')"
            printf '%s' "${entry}"
          }

          results='{}'
          package_list="debian-blockchain-base debian-blockchain-build $(jq -r '.[]' <<<"${PACKAGES}")"
          for package in ${package_list}; do
            echo "Probing ${package}..."
            entry="$(probe_package "${package}")"
            results="$(jq -c --arg package "${package}" --argjson entry "${entry}" '.[$package] = $entry' <<<"${results}")"
          done
          echo "results=${results}" >> "${GITHUB_OUTPUT}"

  base:
    needs: [select, probe]
    if: needs.select.outputs.work_required == 'true'
    name: docker-debian-blockchain-base (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 45
    concurrency:
      group: docker-build-${{ matrix.config.lane }}-debian-blockchain-base
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust cargo:rust-script"

      - name: Cache rust-script
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rust-script
          key: rust-script-${{ matrix.config.lane }}-${{ runner.os }}-v1-${{ hashFiles('docker-*.rs', 'containerctl.rs', 'docker-*/**/*.rs', 'mise.toml') }}
          restore-keys: |
            rust-script-${{ matrix.config.lane }}-${{ runner.os }}-

      - name: Check base image
        id: check-image
        env:
          PACKAGE: debian-blockchain-base
          FORCE_BUILD: ${{ needs.select.outputs.force_base }}
          MANUAL_DISPATCH: ${{ needs.select.outputs.manual_dispatch }}
          PROBE_RESULTS: ${{ needs.probe.outputs.results }}
        run: |
          set -euo pipefail
          entry="$(jq -c --arg package "${PACKAGE}" '.[$package]' <<<"${PROBE_RESULTS}")"
          manifest="$(jq -r '.manifest' <<<"${entry}")"
          manifest_status="$(jq -r '.manifest_status' <<<"${entry}")"
          platform_count="$(jq -r '.platform_count' <<<"${entry}")"
          platforms_found="$(jq -r '[.platforms[] | select(.status == "true")] | length' <<<"${entry}")"
          while IFS=' ' read -r platform status; do
            case "${status}" in
              fail) echo "Failed to check ${PACKAGE}:${platform} on Docker Hub; refusing to guess" >&2; exit 1 ;;
              invalid) echo "Invalid Docker Hub response for ${PACKAGE}:${platform}; refusing to guess" >&2; exit 1 ;;
            esac
          done < <(jq -r '.platforms[] | "\(.name) \(.status)"' <<<"${entry}")
          if [ "${manifest_status}" != "ok" ]; then
            echo "Failed to check ${PACKAGE} on Docker Hub; refusing to guess" >&2
            exit 1
          elif [ "${platform_count}" -eq 0 ]; then
            echo "No platforms configured for ${PACKAGE}; refusing to guess" >&2
            exit 1
          elif [ "${manifest}" != "true" ] && [ "${manifest}" != "false" ]; then
            echo "Invalid Docker Hub response for ${PACKAGE}; refusing to guess" >&2
            exit 1
          elif [ "${manifest}" = "true" ] && [ "${platforms_found}" -ne "${platform_count}" ]; then
            echo "${PACKAGE} manifest exists but platform tags are incomplete; refusing to overwrite it" >&2
            exit 1
          elif [ "${manifest}" = "false" ] && [ "${platforms_found}" -ne 0 ]; then
            echo "A partial ${PACKAGE} publication exists; refusing to overwrite it" >&2
            exit 1
          elif [ "${manifest}" = "true" ] && [ "${FORCE_BUILD}" = "true" ] && [ "${MANUAL_DISPATCH}" != "true" ]; then
            echo "${PACKAGE} is affected but its tag already exists; bump package.version or package.build" >&2
            exit 1
          elif [ "${manifest}" = "true" ]; then
            echo "${PACKAGE} already exists and is unaffected; skipping build"
            echo "needs-build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needs-build=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE} will be built"
          fi

      - name: Login to Docker Hub
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up QEMU
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: all

      - name: Initialize Docker Buildx
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: bcn-ci-${{ github.run_id }}-base

      - name: Build Docker image
        if: steps.check-image.outputs.needs-build == 'true'
        run: mise run ${{ matrix.config.writer && 'docker-build' || 'docker-build-dry' }} debian-blockchain-base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [select, base, probe]
    if: needs.select.outputs.work_required == 'true'
    name: docker-debian-blockchain-build (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 45
    concurrency:
      group: docker-build-${{ matrix.config.lane }}-debian-blockchain-build
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust cargo:rust-script"

      - name: Cache rust-script
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rust-script
          key: rust-script-${{ matrix.config.lane }}-${{ runner.os }}-v1-${{ hashFiles('docker-*.rs', 'containerctl.rs', 'docker-*/**/*.rs', 'mise.toml') }}
          restore-keys: |
            rust-script-${{ matrix.config.lane }}-${{ runner.os }}-

      - name: Check build image
        id: check-image
        env:
          PACKAGE: debian-blockchain-build
          FORCE_BUILD: ${{ needs.select.outputs.force_build }}
          MANUAL_DISPATCH: ${{ needs.select.outputs.manual_dispatch }}
          PROBE_RESULTS: ${{ needs.probe.outputs.results }}
        run: |
          set -euo pipefail
          entry="$(jq -c --arg package "${PACKAGE}" '.[$package]' <<<"${PROBE_RESULTS}")"
          manifest="$(jq -r '.manifest' <<<"${entry}")"
          manifest_status="$(jq -r '.manifest_status' <<<"${entry}")"
          platform_count="$(jq -r '.platform_count' <<<"${entry}")"
          platforms_found="$(jq -r '[.platforms[] | select(.status == "true")] | length' <<<"${entry}")"
          while IFS=' ' read -r platform status; do
            case "${status}" in
              fail) echo "Failed to check ${PACKAGE}:${platform} on Docker Hub; refusing to guess" >&2; exit 1 ;;
              invalid) echo "Invalid Docker Hub response for ${PACKAGE}:${platform}; refusing to guess" >&2; exit 1 ;;
            esac
          done < <(jq -r '.platforms[] | "\(.name) \(.status)"' <<<"${entry}")
          if [ "${manifest_status}" != "ok" ]; then
            echo "Failed to check ${PACKAGE} on Docker Hub; refusing to guess" >&2
            exit 1
          elif [ "${platform_count}" -eq 0 ]; then
            echo "No platforms configured for ${PACKAGE}; refusing to guess" >&2
            exit 1
          elif [ "${manifest}" != "true" ] && [ "${manifest}" != "false" ]; then
            echo "Invalid Docker Hub response for ${PACKAGE}; refusing to guess" >&2
            exit 1
          elif [ "${manifest}" = "true" ] && [ "${platforms_found}" -ne "${platform_count}" ]; then
            echo "${PACKAGE} manifest exists but platform tags are incomplete; refusing to overwrite it" >&2
            exit 1
          elif [ "${manifest}" = "false" ] && [ "${platforms_found}" -ne 0 ]; then
            echo "A partial ${PACKAGE} publication exists; refusing to overwrite it" >&2
            exit 1
          elif [ "${manifest}" = "true" ] && [ "${FORCE_BUILD}" = "true" ] && [ "${MANUAL_DISPATCH}" != "true" ]; then
            echo "${PACKAGE} is affected but its tag already exists; bump package.version or package.build" >&2
            exit 1
          elif [ "${manifest}" = "true" ]; then
            echo "${PACKAGE} already exists and is unaffected; skipping build"
            echo "needs-build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "needs-build=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE} will be built"
          fi

      - name: Login to Docker Hub
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up QEMU
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: all

      - name: Initialize Docker Buildx
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: bcn-ci-${{ github.run_id }}-build

      - name: Build Docker image
        if: steps.check-image.outputs.needs-build == 'true'
        run: mise run ${{ matrix.config.writer && 'docker-build' || 'docker-build-dry' }} debian-blockchain-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packages:
    needs: [select, build, probe]
    if: needs.select.outputs.packages != '[]'
    name: docker-${{ matrix.package }} (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 180
    concurrency:
      group: docker-build-${{ matrix.config.lane }}-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # docker-heimdall ships a 235 MB genesis file through Git LFS.
          lfs: ${{ matrix.package == 'heimdall' }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust cargo:rust-script"

      - name: Cache rust-script
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/rust-script
          key: rust-script-${{ matrix.config.lane }}-${{ runner.os }}-v1-${{ hashFiles('docker-*.rs', 'containerctl.rs', 'docker-*/**/*.rs', 'mise.toml') }}
          restore-keys: |
            rust-script-${{ matrix.config.lane }}-${{ runner.os }}-

      - name: Check target image
        id: check-image
        env:
          PACKAGE: ${{ matrix.package }}
          MANUAL_DISPATCH: ${{ needs.select.outputs.manual_dispatch }}
          PROBE_RESULTS: ${{ needs.probe.outputs.results }}
        run: |
          set -euo pipefail
          entry="$(jq -c --arg package "${PACKAGE}" '.[$package]' <<<"${PROBE_RESULTS}")"
          manifest="$(jq -r '.manifest' <<<"${entry}")"
          manifest_status="$(jq -r '.manifest_status' <<<"${entry}")"
          platform_count="$(jq -r '.platform_count' <<<"${entry}")"
          platforms_found="$(jq -r '[.platforms[] | select(.status == "true")] | length' <<<"${entry}")"
          while IFS=' ' read -r platform status; do
            case "${status}" in
              fail) echo "Failed to check ${PACKAGE}:${platform} on Docker Hub; refusing to guess" >&2; exit 1 ;;
              invalid) echo "Invalid Docker Hub response for ${PACKAGE}:${platform}; refusing to guess" >&2; exit 1 ;;
            esac
          done < <(jq -r '.platforms[] | "\(.name) \(.status)"' <<<"${entry}")
          if [ "${manifest_status}" != "ok" ]; then
            echo "Failed to check ${PACKAGE} on Docker Hub; refusing to guess" >&2
            exit 1
          elif [ "${platform_count}" -eq 0 ]; then
            echo "No platforms configured for ${PACKAGE}; refusing to guess" >&2
            exit 1
          elif [ "${manifest}" != "true" ] && [ "${manifest}" != "false" ]; then
            echo "Invalid Docker Hub response for ${PACKAGE}; refusing to guess" >&2
            exit 1
          elif [ "${manifest}" = "true" ] && [ "${platforms_found}" -ne "${platform_count}" ]; then
            echo "${PACKAGE} manifest exists but platform tags are incomplete; refusing to overwrite it" >&2
            exit 1
          elif [ "${manifest}" = "false" ] && [ "${platforms_found}" -ne 0 ]; then
            echo "A partial ${PACKAGE} publication exists; refusing to overwrite it" >&2
            exit 1
          elif [ "${manifest}" = "true" ] && [ "${MANUAL_DISPATCH}" = "true" ]; then
            echo "needs-build=false" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE} already exists; skipping manual rebuild"
          elif [ "${manifest}" = "true" ]; then
            echo "${PACKAGE} is affected but its tag already exists; bump package.version or package.build" >&2
            exit 1
          else
            echo "needs-build=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE} is affected and will be built"
          fi

      - name: Login to Docker Hub
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Set up QEMU
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: all

      - name: Initialize Docker Buildx
        if: steps.check-image.outputs.needs-build == 'true' && matrix.config.writer
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          name: bcn-ci-${{ github.run_id }}-${{ matrix.package }}

      - name: Build and publish Docker image
        if: steps.check-image.outputs.needs-build == 'true'
        run: mise run ${{ matrix.config.writer && 'docker-build' || 'docker-build-dry' }} "${PACKAGE}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
