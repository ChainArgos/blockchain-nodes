        if: '${{ (!cancelled() && steps.base.outputs.sources == ''true'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.sources_root.outputs.cache-hit != ''true'' && steps.plan.outcome == ''success'' && (steps.replan.outputs.rust_root_mode || steps.plan.outputs.rust_root_mode) != ''none'') && (steps.sources_fetch_all.outcome == ''success'') }}'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-${{ steps.sources_locks.outputs.hash }}'
      - id: sources_root_key
        name: Record the sources cache key
        if: '${{ (!cancelled() && steps.base.outputs.sources == ''true'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.sources_root.outputs.cache-hit != ''true'' && steps.plan.outcome == ''success'' && (steps.replan.outputs.rust_root_mode || steps.plan.outputs.rust_root_mode) != ''none'') && (steps.sources_fetch_all.outcome == ''success'') }}'
        env:
          CACHE_KEY: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-${{ steps.sources_locks.outputs.hash }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      # jactionlint ignore=shellcheck
      - name: velnor-ci inputs save
        if: '${{ github.event_name == ''pull_request'' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && steps.plan.outcome == ''success'' && (steps.replan.outputs.rust_root_mode || steps.plan.outputs.rust_root_mode) != ''none'' }}'
        run: '. "$VELNOR_EXEC" inputs save --target-dir target --scope-cache "${RUNNER_TEMP}/velnor-input-scopes-${GITHUB_JOB}.json"'
      # jactionlint ignore=shellcheck
      - id: delta
        name: velnor-ci delta stage
        if: '${{ github.event_name == ''pull_request'' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && steps.plan.outcome == ''success'' && (steps.replan.outputs.rust_root_mode || steps.plan.outputs.rust_root_mode) != ''none'' }}'
        env:
          BASE_CACHE_KEY: '${{ steps.target_root.outputs.cache-matched-key }}'
          EXPECTED_SOURCE_IDENTITY: '${{ steps.delta_base_root.outputs.source_identity }}'
          VELNOR_DELTA_PACKAGES: blockchain-nodes-builder
        run: '. "$VELNOR_EXEC" delta stage --target-dir target --staging-dir target.velnor-delta'
      - id: save_delta_root
        name: Save the delta cache
        if: '${{ github.event_name == ''pull_request'' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && steps.restored.outcome == ''success'' && steps.replan.outcome != ''failure'' && steps.delta.outputs.save == ''true'' && steps.prepare.outputs.cold != ''true'' && steps.plan.outcome == ''success'' && (steps.replan.outputs.rust_root_mode || steps.plan.outputs.rust_root_mode) != ''none'' }}'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target.velnor-delta
          key: 'velnor-dlt-pr${{ github.event.pull_request.number }}-rust.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.delta_base_root.outputs.base8 }}-${{ github.run_id }}'
      # jactionlint ignore=shellcheck
      - id: report_cache_metrics
        name: Report cache telemetry
        if: '${{ !cancelled() }}'
        continue-on-error: true
        env:
          VELNOR_REPORT_CACHES: '[{"family":"tools","restore_step":"tools","root":null,"save_step":"save_tools"},{"family":"sources","restore_step":"sources_root","root":null,"save_step":"sources_save_root"},{"family":"target","restore_step":"target_root","root":".","save_step":"save_target_root"},{"family":"delta","restore_step":"delta_root","root":".","save_step":"save_delta_root"}]'
          VELNOR_REPORT_STEPS: '${{ toJSON(steps) }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
          VELNOR_TESTS_RUN: '${{ steps.test.outputs.tests_run }}'
        run: '. "$VELNOR_EXEC" report'
      - name: Upload cache metrics
        if: '${{ (steps.report_cache_metrics.outcome == ''success'') && (!cancelled()) }}'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 'ci-metrics-${{ github.job }}'
          path: '${{ runner.temp }}/ci-metrics.json'
          if-no-files-found: error
          retention-days: 3
          overwrite: true
  lint-jactionlint:
    name: Jactionlint
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    outputs:
      # jactionlint ignore=unused-job-output
      skip_push: '${{ steps.merge_group.outputs.skip }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.110
        uses: tailrocks/velnor-new/actions/setup-velnor@3e56d7299da0cb7e5890a673d118fbc2c5045565  # tools-v0.1.110
        with:
          version: '0.1.110'
          sha256-linux-x64: '5d587b7d3abdd2b5b548cebbdaa8377b4e8aca825fab605c964d0e3cd93b6fc0'
          sha256-linux-arm64: '6ea0bc1a15b65a02861f44872f7578e6a4a8af60e626bf35de617ef0523a1595'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - id: merge_group
        name: velnor-ci merge-group-passed
        if: '${{ github.event_name == ''push'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) }}'
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          VELNOR_REQUIRED_CHECK: Required
        run: '. "$VELNOR_EXEC" merge-group-passed'
      - name: Check out
        if: '${{ steps.merge_group.outputs.skip != ''true'' }}'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install tools
        if: '${{ steps.merge_group.outputs.skip != ''true'' }}'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          cache: false
          install_args: jactionlint shellcheck
      - name: Lint the workflows
        if: '${{ steps.merge_group.outputs.skip != ''true'' }}'
        run: 'jactionlint --config-file .github/jactionlint.yaml --format github --strict-exit --no-online --no-color --pyflakes= --shellcheck=shellcheck'
  lint-shellcheck:
    name: Shellcheck
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) }}'
