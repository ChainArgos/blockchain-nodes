        uses: tailrocks/velnor-new/actions/setup-velnor@3e56d7299da0cb7e5890a673d118fbc2c5045565  # tools-v0.1.110
        with:
          version: '0.1.110'
          sha256-linux-x64: '5d587b7d3abdd2b5b548cebbdaa8377b4e8aca825fab605c964d0e3cd93b6fc0'
          sha256-linux-arm64: '6ea0bc1a15b65a02861f44872f7578e6a4a8af60e626bf35de617ef0523a1595'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust --job rust=always --job lint-jactionlint=always --job lint-shellcheck=always --tests rust=root'
        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
  cache:
    name: Cache
    needs:
      - rust
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled()) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.110
        uses: tailrocks/velnor-new/actions/setup-velnor@3e56d7299da0cb7e5890a673d118fbc2c5045565  # tools-v0.1.110
        with:
          version: '0.1.110'
          sha256-linux-x64: '5d587b7d3abdd2b5b548cebbdaa8377b4e8aca825fab605c964d0e3cd93b6fc0'
          sha256-linux-arm64: '6ea0bc1a15b65a02861f44872f7578e6a4a8af60e626bf35de617ef0523a1595'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Download cache metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: 'ci-metrics-*'
          path: '${{ runner.temp }}/ci-metrics'
      # jactionlint ignore=shellcheck
      - name: Check cache waste
        env:
          VELNOR_REPORT_NEEDS: '${{ toJSON(needs) }}'
          GITHUB_TOKEN: '${{ (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '''' }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: '. "$VELNOR_EXEC" report --check "$RUNNER_TEMP/ci-metrics"'
