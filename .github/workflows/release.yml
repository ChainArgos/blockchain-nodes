        if: ${{ needs.image-admission-kcc-geth.outputs.existing != 'true' }}
        run: velnor-workflow release verify-digests --dir image-artifacts-kcc-geth --archs amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
