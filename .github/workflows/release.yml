    if: ${{ always() && needs.release-verified.outputs.verify_result == 'success' && needs.image-admission-kcc-geth.result == 'success' && (needs.image-platform-kcc-geth.result == 'success' || needs.image-platform-kcc-geth.result == 'skipped') }}
