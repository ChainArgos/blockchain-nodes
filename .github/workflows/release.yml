  release-github-hosted-rust-blockchain-nodes-builder:
    name: "github-hosted / Rust / rust-blockchain-nodes-builder"
    needs: [verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@eed474c4a1d9b071fd1b5de00c769c8997398e5a
        with:
          rev: eed474c4a1d9b071fd1b5de00c769c8997398e5a
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=eed474c4a1d9b071fd1b5de00c769c8997398e5a" >> "$GITHUB_ENV"
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Provision Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add 'aarch64-apple-darwin' 'aarch64-unknown-linux-gnu' 'x86_64-apple-darwin' 'x86_64-unknown-linux-gnu' 'x86_64-unknown-linux-musl'
      - name: Bound the Mr. Boxington store
        shell: bash
        run: echo "MBX_GC_MAX_SIZE=12GiB" >> "$GITHUB_ENV"
      - name: Set up Mr. Boxington
        id: mbx-cache
        uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
        with:
          backend: github
          github-cache-mode: objects
          version: 1.12.0
          cache-key: velnor-mbx-v3-e9b1fe5d8b7a-${{ runner.os }}-${{ runner.arch }}-github-hosted-linux-x64-untrusted-ok-rust-blockchain-nodes-builder-${{ hashFiles('.cargo/**', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('./**/*.rs', 'benches/**', 'examples/**', 'mise.lock', 'src/**', 'tests/**') }}
          restore-keys: |
            velnor-mbx-v3-e9b1fe5d8b7a-${{ runner.os }}-${{ runner.arch }}-github-hosted-linux-x64-untrusted-ok-rust-blockchain-nodes-builder-${{ hashFiles('.cargo/**', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}-
            velnor-mbx-v3-e9b1fe5d8b7a-${{ runner.os }}-${{ runner.arch }}-github-hosted-linux-x64-untrusted-ok-rust-blockchain-nodes-builder-
          save-on-workflow-dispatch: true
      - name: Restore mold 2.42.0 cache
        id: mold-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/velnor/mold/2.42.0
          key: velnor-mold-2.42.0-${{ runner.os }}-${{ runner.arch }}
      - name: Set up mold 2.42.0
        shell: bash
        env:
          MOLD_VERSION: 2.42.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) mold_arch=x86_64; expected='f5ed2f6e31d1ada4f07fe766fe0de7a73104d1c5cdc59086fcecc16a43720b6d' ;;
            aarch64) mold_arch=aarch64; expected='3c9a0a3624aac8a2007569ae50c33b3129a0f0ae8bcc974aeee2f8939d295190' ;;
            *) echo "unsupported mold architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          cache_dir="$HOME/.cache/velnor/mold/$MOLD_VERSION"
          archive="$cache_dir/mold-$MOLD_VERSION-$mold_arch-linux.tar.gz"
          mkdir -p "$cache_dir"
          if [[ ! -s "$archive" ]]; then
            temporary="$archive.download"
            trap 'rm -f "$temporary"' EXIT
            curl --fail --show-error --silent --location --http1.1 --continue-at - --retry 20 --retry-all-errors --retry-delay 5 --retry-max-time 1800 --connect-timeout 30 --max-time 900 \
              --output "$temporary" \
              "https://github.com/rui314/mold/releases/download/v$MOLD_VERSION/mold-$MOLD_VERSION-$mold_arch-linux.tar.gz"
            printf '%s  %s\n' "$expected" "$temporary" | sha256sum --check --strict
            mv "$temporary" "$archive"
            trap - EXIT
          fi
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          if [[ "$(id -u)" -eq 0 ]]; then
            tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
          else
            sudo tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
          fi
          command -v mold >/dev/null
          mold --version | grep -F "$MOLD_VERSION"
      - name: Restore "Rust crate (blockchain-nodes-builder)" cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-release-${{ runner.os }}-github-hosted-linux-x64-untrusted-ok-rust-blockchain-nodes-builder-${{ hashFiles('.cargo/**', 'Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain') }}
      - name: Prepare Cargo sources
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          root='.'
          if [[ "$root" != "." ]]; then
            cd -- "$root"
          fi
          cargo fetch --locked
      - name: Plan full release selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
        run: |
          set -euo pipefail
          mkdir -p .velnor-ci-selection
          velnor-workflow plan --config .github/ci/project.toml

      - name: Formatting check ("Rust crate (blockchain-nodes-builder)")
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-blockchain-nodes-builder
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CARGO_NET_OFFLINE: "true"
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-blockchain-nodes-builder --phase fmt

      - name: Clippy check ("Rust crate (blockchain-nodes-builder)")
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-blockchain-nodes-builder
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CARGO_NET_OFFLINE: "true"
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-blockchain-nodes-builder --phase clippy

      - name: Tests ("Rust crate (blockchain-nodes-builder)")
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-blockchain-nodes-builder
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CARGO_NET_OFFLINE: "true"
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-blockchain-nodes-builder --phase test

  release-verified:
    name: Aggregate release unit results
    if: ${{ always() }}
    needs: [verify, release-github-hosted-docker-docker-arbitrum, release-github-hosted-docker-docker-avalanchego, release-github-hosted-docker-docker-beacon-kit, release-github-hosted-docker-docker-bera-reth, release-github-hosted-docker-docker-bitcoin-cash, release-github-hosted-docker-docker-bitcoin-core, release-github-hosted-docker-docker-bnb-beacon-chain, release-github-hosted-docker-docker-bor, release-github-hosted-docker-docker-bsc-geth, release-github-hosted-docker-docker-cardano-node, release-github-hosted-docker-docker-celo-geth, release-github-hosted-docker-docker-celo-op-geth, release-github-hosted-docker-docker-celo-op-node, release-github-hosted-docker-docker-debian-blockchain-base, release-github-hosted-docker-docker-debian-blockchain-build, release-github-hosted-docker-docker-dogecoin-core, release-github-hosted-docker-docker-eigenda-proxy, release-github-hosted-docker-docker-fetchd, release-github-hosted-docker-docker-fraxtal-op-geth, release-github-hosted-docker-docker-fraxtal-op-node, release-github-hosted-docker-docker-geth, release-github-hosted-docker-docker-gnosis-geth, release-github-hosted-docker-docker-heco-geth, release-github-hosted-docker-docker-heimdall, release-github-hosted-docker-docker-kcc-geth, release-github-hosted-docker-docker-lighthouse, release-github-hosted-docker-docker-litecoin-core, release-github-hosted-docker-docker-octez, release-github-hosted-docker-docker-omnicore, release-github-hosted-docker-docker-op-geth, release-github-hosted-docker-docker-op-node, release-github-hosted-docker-docker-ronin-geth, release-github-hosted-docker-docker-scroll-geth, release-github-hosted-docker-docker-sonic-geth, release-github-hosted-docker-docker-tron-java, release-github-hosted-docker-docker-wbt-geth, release-github-hosted-rust-blockchain-nodes-builder]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      verify_result: ${{ needs.verify.result }}
      version: ${{ needs.verify.outputs.version }}
    steps:
      - name: Export unit results
        run: echo "release unit lanes complete"

  image-admission-arbitrum:
    needs: [verify, image-debian-blockchain-base]
    name: Admit immutable image tag
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      existing: ${{ steps.inspect.outputs.existing }}
      index_digest: ${{ steps.inspect.outputs.index_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Log in to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Inspect version tag without mutation
        id: inspect
        env:
          GHCR_IMAGE: "chainargos/arbitrum"
          VERSION: ${{ needs.verify.outputs.version }}
          RECOVERY_INDEX_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.existing-image-digest || '' }}
        run: |
          set -euo pipefail
          ref="${GHCR_IMAGE}:${VERSION}"
          error_file="$(mktemp)"
          if docker buildx imagetools inspect "$ref" --format '{{json .}}' > image.json 2>"$error_file"; then
            index_digest="$(jq -er '.manifest.digest' image.json)"
            case "$index_digest" in
              sha256:[0-9a-fA-F]*) ;;
              *) echo "::error::existing image tag $ref returned an invalid index digest" >&2; exit 1 ;;
            esac
            if [ -z "$RECOVERY_INDEX_DIGEST" ] || [ "$index_digest" != "$RECOVERY_INDEX_DIGEST" ]; then
              echo "::error::OCI tag $ref already exists with an unverified index digest; refusing to adopt unknown bytes (supply existing-image-digest to resume a verified run)" >&2
              exit 1
            fi
            echo "adopting explicitly supplied recovery index $index_digest"
            {
              echo "existing=true"
              echo "index_digest=$index_digest"
            } >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|no such manifest|not found|name unknown' "$error_file"; then
            {
              echo "existing=false"
              echo "index_digest="
            } >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            echo "::error::could not determine whether OCI tag $ref exists; refusing a fail-open publish" >&2
            exit 1
          fi

  image-platform-arbitrum:
    name: Build ${{ matrix.arch }} image
    needs: [verify, image-admission-arbitrum]
    if: ${{ needs.image-admission-arbitrum.outputs.existing != 'true' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GHCR_IMAGE: "chainargos/arbitrum"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
          keep-state: true
      - name: Log in to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push platform image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-arbitrum
          file: "docker-arbitrum/Dockerfile"
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: |
