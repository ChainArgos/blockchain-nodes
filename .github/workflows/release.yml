        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Inspect version tag without mutation
        id: inspect
        env:
          GHCR_IMAGE: "chainargos/lighthouse"
          VERSION: ${{ needs.verify.outputs.version }}
