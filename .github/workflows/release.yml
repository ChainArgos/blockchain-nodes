    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GHCR_IMAGE: "chainargos/wbt-geth"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
          keep-state: true
      - name: Log in to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push platform image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-wbt-geth
          file: "docker-wbt-geth/Dockerfile"
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }}
            type=gha,scope=chainargos-wbt-geth-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
            type=gha,scope=chainargos-wbt-geth-${{ matrix.arch }},mode=max
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ env.GHCR_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ChainArgos/blockchain-nodes
      - name: Record platform digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          hex="${digest#sha256:}"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::platform build did not return a digest" >&2; exit 1 ;;
          esac
          case "$hex" in
            ''|*[!0-9a-f]*) echo "::error::platform digest is not lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#hex}" -eq 64 ] || { echo "::error::platform digest has invalid length" >&2; exit 1; }
          printf '%s\n' "$digest" > "image-${{ matrix.arch }}.digest"
      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-platform-wbt-geth-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 2

  image-wbt-geth:
    if: ${{ always() && needs.release-verified.outputs.verify_result == 'success' && needs.image-admission-wbt-geth.result == 'success' && (needs.image-platform-wbt-geth.result == 'success' || needs.image-platform-wbt-geth.result == 'skipped') }}
    needs: [release-verified, image-admission-wbt-geth, image-platform-wbt-geth]
    name: Assemble one multi-platform image
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.push.outputs.index_digest }}
    env:
      GHCR_IMAGE: "chainargos/wbt-geth"
      VERSION: ${{ needs.release-verified.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@eed474c4a1d9b071fd1b5de00c769c8997398e5a
        with:
          rev: eed474c4a1d9b071fd1b5de00c769c8997398e5a
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=eed474c4a1d9b071fd1b5de00c769c8997398e5a" >> "$GITHUB_ENV"
      - name: Download platform digests
        if: ${{ needs.image-admission-wbt-geth.outputs.existing != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-platform-wbt-geth-*
          path: image-artifacts-wbt-geth
          merge-multiple: true
      - name: Verify the complete platform digest set
        if: ${{ needs.image-admission-wbt-geth.outputs.existing != 'true' }}
        run: velnor-workflow release verify-digests --dir image-artifacts-wbt-geth --archs amd64,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Log in to docker.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble and inspect immutable image index
        id: push
        env:
          IMAGE_ALREADY_EXISTS: ${{ needs.image-admission-wbt-geth.outputs.existing }}
          EXPECTED_EXISTING_INDEX_DIGEST: ${{ needs.image-admission-wbt-geth.outputs.index_digest }}
        run: |
          set -euo pipefail
          if [ "$IMAGE_ALREADY_EXISTS" = true ]; then
            docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
            index_digest="$(jq -er '.manifest.digest' image-digests.json)"
            [ "$index_digest" = "$EXPECTED_EXISTING_INDEX_DIGEST" ] || {
              echo "::error::version tag moved from $EXPECTED_EXISTING_INDEX_DIGEST to $index_digest during admission" >&2
              exit 1
            }
          else
            amd64_digest="$(tr -d '[:space:]' < "image-artifacts-wbt-geth/image-amd64.digest")"
            arm64_digest="$(tr -d '[:space:]' < "image-artifacts-wbt-geth/image-arm64.digest")"
            docker buildx imagetools create \
              --tag "${GHCR_IMAGE}:${VERSION}" \
              "${GHCR_IMAGE}@$amd64_digest" \
              "${GHCR_IMAGE}@$arm64_digest"
            docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
            jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
              any(.manifest.manifests[]; .digest == $amd64 and .platform.architecture == "amd64") and
              any(.manifest.manifests[]; .digest == $arm64 and .platform.architecture == "arm64")
            ' image-digests.json >/dev/null || {
              echo "::error::version tag does not reference the verified platform digests" >&2
              exit 1
            }
            [ "$(jq -r '[.manifest.manifests[] | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")] | length' image-digests.json)" = "2" ] || {
              echo "::error::version tag carries an unexpected platform set" >&2
              exit 1
            }
          fi
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
          index_digest="$(jq -er '.manifest.digest' image-digests.json)"
          case "$index_digest" in
            sha256:[0-9a-fA-F]*) ;;
            *) echo "::error::manifest inspection did not return an index digest" >&2; exit 1 ;;
          esac
          printf 'index_digest=%s\n' "$index_digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$index_digest" > image-index.digest
      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-wbt-geth
          path: |
            image-digests.json
            image-index.digest
          if-no-files-found: error
          retention-days: 2
