full_commands = ["mbx fmt --manifest-path 'Cargo.toml' -- --check", "mbx clippy --locked --profile test --all-targets --all-features --package 'blockchain-nodes-builder' -- -D warnings", "mbx test --locked --all-features --package 'blockchain-nodes-builder'"]
phases = ["fmt", "clippy", "test"]
check_commands = ["mbx check --locked --profile test --all-targets --all-features --package 'blockchain-nodes-builder'"]
platform = "linux-x64"
trust = "untrusted-ok"
[unit.capabilities]
docker = true
nested_privileged_docker = false
buildx_compose = false
testcontainers = true
services_with_readiness = false
browser_binaries = false
