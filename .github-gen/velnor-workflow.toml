schema = 2

[generator]
repository = "ChainArgos/blockchain-nodes"
revision = "eed474c4a1d9b071fd1b5de00c769c8997398e5a"

[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"
files = ["ci-pr.yml", "ci-policy.yml", "ci-main.yml", "nightly.yml", "maintenance.yml", "release.yml"]

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
# DCO (GitHub) is produced by the hand-owned dco.yml static passthrough (R7:
# cncf/dco2 app install unavailable via API; org-admin web flow required),
# not by ci-pr/ci-policy, so it rides the external list until the app lands.
ruleset_external_status_checks = ["DCO (GitHub)"]

# [renovate] ON HOLD for wave pin 3 (W4 precedent): the pin-2 validator
# demands a velnor provider for [renovate], which the public-repo
# visibility policy forbids, so the table is unsatisfiable at this pin.
# Until /tmp/report-wavepin3.md lands with the G12 validation-only fix,
# dependency updates keep flowing through the hand-owned renovate.yml +
# renovate-config.js static passthrough below. At pin 3: uncomment,
# re-render, re-verify, merge.
# [renovate]
# enabled = true
# schedule = "0 * * * *"
# token = "RENOVATE_TOKEN"
# host_rules_secret = "RENOVATE_HOST_RULES_JSON"
[release]
enabled = true
reason = "tag-gated multi-arch publication of all 36 node images to Docker Hub (chainargos/*); one VERSION per tag (R3), base->build->leaves tiers, heimdall LFS (R4); per-image build-args deferred (R5: no typed surface)"
kind = "docker"
registry = "docker.io"
registry_username_secret = "DOCKERHUB_USERNAME"
registry_password_secret = "DOCKERHUB_TOKEN"
tag_pattern = "v*"

[[release.image]]
name = "arbitrum"
image = "chainargos/arbitrum"
dockerfile = "docker-arbitrum/Dockerfile"
context = "docker-arbitrum"
platforms = ["linux/amd64", "linux/arm64"]
needs = ["debian-blockchain-base"]

